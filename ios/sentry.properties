# Tells sentry-cli which project the iOS build phases upload to.
#
# No auth token here on purpose: it is a real secret and this file is committed.
# The token comes from SENTRY_AUTH_TOKEN, stored as an EAS secret on the
# production and preview environments.
defaults.url=https://sentry.io/
defaults.org=the-creative-company
defaults.project=unfold-mobile
