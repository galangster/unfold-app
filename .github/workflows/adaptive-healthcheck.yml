name: Adaptive Backend Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  adaptive-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run adaptive backend healthcheck
        env:
          EXPO_PUBLIC_VIBECODE_BACKEND_URL: ${{ vars.EXPO_PUBLIC_VIBECODE_BACKEND_URL }}
          EXPO_PUBLIC_VIBECODE_BACKEND_FALLBACK_URL: ${{ vars.EXPO_PUBLIC_VIBECODE_BACKEND_FALLBACK_URL }}
        run: bun run health:adaptive
