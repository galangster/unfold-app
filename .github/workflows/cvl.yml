name: CVL Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CVL report
        env:
          BASE_REF: origin/${{ github.base_ref }}
          EXPO_PUBLIC_VIBECODE_BACKEND_URL: ${{ vars.EXPO_PUBLIC_VIBECODE_BACKEND_URL }}
          EXPO_PUBLIC_VIBECODE_BACKEND_FALLBACK_URL: ${{ vars.EXPO_PUBLIC_VIBECODE_BACKEND_FALLBACK_URL }}
        run: bun run verify:report

      - name: Upload CVL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvl-report-unfold
          path: reports/cvl/
