name: CVL Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # `bun run test` runs the npm script, which invokes the jest binary.
      # Do NOT use `bun test` — that is bun's own runner and it cannot parse
      # React Native's Flow-typed sources, so it fails on every file.
      - name: Unit tests
        run: bun run test

      # Running the Maestro flows needs a simulator, but a dead `id:` selector
      # makes a step a silent no-op — which is how the suite rotted last time.
      # This catches that on Linux, with no simulator.
      - name: Maestro selector check
        run: node scripts/verify-maestro-selectors.mjs

      - name: Run CVL report
        env:
          BASE_REF: origin/${{ github.base_ref }}
          EXPO_PUBLIC_VIBECODE_BACKEND_URL: ${{ vars.EXPO_PUBLIC_VIBECODE_BACKEND_URL }}
          EXPO_PUBLIC_VIBECODE_BACKEND_FALLBACK_URL: ${{ vars.EXPO_PUBLIC_VIBECODE_BACKEND_FALLBACK_URL }}
        run: bun run verify:report

      - name: Upload CVL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cvl-report-unfold
          path: reports/cvl/
