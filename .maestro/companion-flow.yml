# Companion chat — send path.
#
# VERIFIES:
#   1. Companion is a top-level tab and its screen mounts.
#   2. Typing swaps the input bar's mic button for the send button.
#   3. Sending renders the user's own message in the transcript and clears the
#      composer (the send button disappears again).
#
# Deliberately stops at the user message: the companion's reply comes from a
# live streaming backend, so asserting on reply content would not be
# deterministic. The user bubble is written locally and always is.
#
# PRECONDITION: the account is not out of free companion messages for the day
# (a spent free quota opens the premium sheet instead of sending).

appId: com.unfoldapp.ios
---
- launchApp

- tapOn:
    id: "bottom-tab-companion"
- assertVisible:
    id: "companion-screen"

- tapOn:
    id: "companion-input"
- inputText: "Maestro end to end check"

# Non-empty draft turns the mic into the send button.
- assertVisible:
    id: "companion-send"

- tapOn:
    id: "companion-send"

# The user's message is appended to the transcript immediately.
- extendedWaitUntil:
    visible: "Maestro end to end check"
    timeout: 10000

# Composer cleared — no send button while the field is empty.
- assertNotVisible:
    id: "companion-send"
