# Devotional reading — open the reader and its preferences sheet.
#
# VERIFIES:
#   1. The home hero devotional CTA opens the devotional reader.
#   2. The reader's "Aa" button opens the devotional reader preferences sheet.
#   3. That sheet exposes the shared "All settings" row (same row the Bible
#      reader sheet uses), and the backdrop closes the sheet.
#   4. The Today tab returns to the home screen.
#
# PRECONDITION: the account has an active devotional series, so the home hero
# renders its CTA (states `unread` / `complete-today` / `tomorrow-locked`).
# Generating a series requires the live devotional backend, so this flow does
# not create one — it reads whatever the device already has. On a device with
# no series the home card shows the empty state instead and this flow fails at
# the CTA tap, which is the correct signal that the precondition is unmet.

appId: com.unfoldapp.ios
---
- launchApp

- tapOn:
    id: "bottom-tab-today"
- assertVisible:
    id: "home-avatar-button"

- tapOn:
    id: "home-devotional-cta"

- extendedWaitUntil:
    visible:
      id: "devotional-reader-screen"
    timeout: 30000

- tapOn:
    id: "devotional-reader-settings-button"
- assertVisible:
    id: "devotional-reader-preferences-sheet"
- assertVisible:
    id: "reader-all-settings-row"

- tapOn:
    id: "reader-bottom-sheet-backdrop"
- assertNotVisible:
    id: "devotional-reader-preferences-sheet"

- tapOn:
    id: "bottom-tab-today"
- assertVisible:
    id: "home-avatar-button"
