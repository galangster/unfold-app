# Highlight persistence across an app restart.
#
# VERIFIES: a Bible highlight created in the reader is still there after the
# app is fully relaunched — i.e. it was written to the persisted store, not
# just held in memory. Uses Genesis 1:2 so it does not collide with the verse
# used by bible-reader-flow / verse-note-autosave.
#
# PRECONDITION: the Bible database is already downloaded.

appId: com.unfoldapp.ios
---
# ── Phase 1: create the highlight ───────────────────────────────────────────
- launchApp

- tapOn:
    id: "bottom-tab-bible"
- extendedWaitUntil:
    visible:
      id: "bible-reader-screen"
    timeout: 20000

- tapOn:
    id: "reader-chapter-title"
- assertVisible:
    id: "bible-navigator"
- tapOn:
    id: "bible-navigator-search"
- inputText: "Genesis 1"
- tapOn:
    id: "bible-navigator-goto"
- assertVisible:
    id: "bible-verse-2"

- tapOn:
    id: "bible-verse-2"
- tapOn:
    id: "bible-verse-action-highlight"
- assertVisible:
    id: "bible-highlight-color-yellow"
- tapOn:
    id: "bible-highlight-color-yellow"
- assertNotVisible:
    id: "bible-highlight-color-yellow"
- assertNotVisible:
    id: "bible-verse-action-highlight"

# ── Phase 2: relaunch and check it survived ─────────────────────────────────
- launchApp:
    clearState: false

- tapOn:
    id: "bottom-tab-bible"
- extendedWaitUntil:
    visible:
      id: "bible-reader-screen"
    timeout: 20000

- tapOn:
    id: "reader-settings-button"
- assertVisible:
    id: "bible-reader-preferences-sheet"
# The preferences sheet scrolls (ReaderBottomSheet maxHeightRatio 0.72);
# this row sits below the fold, so it must be scrolled to before use.
- scrollUntilVisible:
    element:
      id: "reader-saved-verses-row"
    direction: DOWN
- tapOn:
    id: "reader-saved-verses-row"
# See bible-reader-flow: the card exposes only
# "Bible <kind>: <text>" — the verse reference is not in the hierarchy.
- assertVisible: "Bible highlight: Now the earth was formless.*"
