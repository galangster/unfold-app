# Bible reader — navigation + highlighting.
#
# VERIFIES:
#   1. The Bible tab lands on the reader (the Bible index auto-forwards).
#   2. The chapter-title header button opens the book/chapter navigator and the
#      navigator's reference search jumps to an exact chapter.
#   3. Tapping a verse opens the verse context bar.
#   4. Applying the free (yellow) highlight closes the context bar and writes a
#      real record — confirmed by finding "Genesis 1:1 (BSB)" in the saved
#      Bible highlights library reached from the reader preferences sheet.
#
# PRECONDITION: the Bible database is already downloaded (any previous launch
# that opened the Bible does this). A fresh install shows the download sheet
# instead of the reader.

appId: com.unfoldapp.ios
---
- launchApp

- tapOn:
    id: "bottom-tab-bible"

- extendedWaitUntil:
    visible:
      id: "bible-reader-screen"
    timeout: 20000

# Jump to a known chapter so the rest of the flow is position-independent.
- tapOn:
    id: "reader-chapter-title"
- assertVisible:
    id: "bible-navigator"
- tapOn:
    id: "bible-navigator-search"
- inputText: "Genesis 1"
- tapOn:
    id: "bible-navigator-goto"

- assertVisible:
    id: "bible-reader-screen"
- assertVisible:
    id: "bible-verse-1"

# Verse tap opens the context bar (Explain / Highlight / Note / Share).
- tapOn:
    id: "bible-verse-1"
- assertVisible:
    id: "bible-verse-action-highlight"

# Highlight with the free colour.
- tapOn:
    id: "bible-verse-action-highlight"
- assertVisible:
    id: "bible-highlight-color-yellow"
- tapOn:
    id: "bible-highlight-color-yellow"

# Applying a colour clears the selection and tears the context bar down.
- assertNotVisible:
    id: "bible-highlight-color-yellow"
- assertNotVisible:
    id: "bible-verse-action-highlight"

# The highlight is really persisted — find it in the saved highlights library.
- tapOn:
    id: "reader-settings-button"
- assertVisible:
    id: "bible-reader-preferences-sheet"
# The preferences sheet scrolls (ReaderBottomSheet maxHeightRatio 0.72);
# this row sits below the fold, so it must be scrolled to before use.
- scrollUntilVisible:
    element:
      id: "reader-saved-verses-row"
    direction: DOWN
- tapOn:
    id: "reader-saved-verses-row"
# The card exposes one flattened a11y label; it now includes the verse
# reference (my-content.tsx), so assert the reference itself.
- assertVisible: "Bible highlight, Genesis 1:1 \\(BSB\\).*"
